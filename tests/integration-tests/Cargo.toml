[package]
name = "tests-dvp-swap-program"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
litesvm = "=0.16.0"
borsh = { workspace = true }
dvp-swap-program-client = { workspace = true, features = ["fetch"] }
solana-account = "4.3"
solana-clock = "3.1"
solana-instruction = "3.4.1"
solana-keypair = "3"
solana-packet = "4.2"
solana-nullable = { version = "1.3", features = ["bytemuck"] }
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-pubkey = { version = "4.2.1", features = ["curve25519"] }
solana-sdk-ids = "3.1"
solana-signer = "3"
solana-transaction = { version = "4.1", features = ["wincode", "serde"] }
spl-associated-token-account-interface = "2"
spl-token-interface = "3"
spl-token-2022-interface = "=3.1.1"
spl-tlv-account-resolution = "0.11.4"
spl-transfer-hook-interface = "2.1"
sha2 = "0.10"
wincode = "0.5"
