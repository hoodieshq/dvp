[package]
name = "dvp-swap-program-client"
version = "0.0.1"
edition = "2021"
autotests = false
description = "Rust client for the DvP Swap Program"
license = "MIT"
repository = "https://github.com/solana-foundation/dvp"

[dependencies]
borsh = { workspace = true, features = ["derive"] }
solana-account-info = "3.1.1"
# `curve25519` enables the host-side PDA derivation (`find_program_address`)
# used by the handwritten `verify` module; `borsh` provides the Borsh impls
# the generated account/instruction structs derive against. Host-only client
# crate, so neither reaches the on-chain program build.
solana-pubkey = { version = "4.2.1", features = ["curve25519", "borsh"] }
solana-instruction = "3.4.1"
solana-cpi = "3.1"
num-derive = { workspace = true }

solana-account-decoder-client-types = { version = "4.2.2", optional = true }
solana-transaction-status-client-types = { version = "4.2.2", optional = true }
bs58 = { version = "0.5", optional = true }
solana-client = { version = "4.2.2", optional = true }
solana-account = { version = "4.3", optional = true }
num-traits = { workspace = true }

solana-program-error = "3.0"
thiserror = { workspace = true }

# Host-side confidential keys, proofs and transaction preparation.
bytemuck = "1"
curve25519-dalek = "4.1"
hkdf = "0.12"
sha2 = "0.10"
solana-compute-budget-interface = "3.0"
spl-record = { version = "0.4", features = ["no-entrypoint"] }
solana-hash = "4.2"
solana-keypair = "3"
solana-message = { version = "4.4", features = ["wincode"] }
solana-packet = "4.2"
solana-rent = "4.3"
solana-signature = "3.3"
solana-signer = "3"
solana-system-interface = { version = "3.2", features = ["bincode"] }
solana-transaction = { version = "4.1", features = ["wincode", "serde"] }
solana-zk-sdk = "7.0.1"
solana-zk-sdk-pod = "0.1.2"
solana-zk-elgamal-proof-interface = "0.1.3"
spl-token-2022-interface = "3.1.1"
spl-token-confidential-transfer-proof-generation = "0.6.1"
spl-token-confidential-transfer-proof-extraction = "0.6.1"
spl-transfer-hook-interface = "2.1"
wincode = "0.5"

[[test]]
name = "integration"
path = "tests/main.rs"
required-features = ["fetch"]

[dev-dependencies]
solana-loader-v3-interface = { version = "8.0", features = ["wincode"] }
litesvm = "=0.16.0"
base64 = "0.22"
futures = "0.3"
solana-address-lookup-table-interface = { version = "3.1", features = ["bincode"] }
solana-clock = "3.1"
solana-nullable = { version = "1.3", features = ["bytemuck"] }
solana-program-option = "3.1"
solana-program-pack = "3.1"
solana-sdk-ids = "3.1"
spl-associated-token-account-interface = "2"
spl-token-interface = "3"
spl-tlv-account-resolution = "0.11.4"
hmac = "0.12"
serde_json = { workspace = true }

[features]
default = []
fetch = ["solana-client", "solana-account", "solana-account-decoder-client-types", "solana-transaction-status-client-types", "bs58"]

[package.metadata.cargo-machete]
ignored = ["num-traits"]
